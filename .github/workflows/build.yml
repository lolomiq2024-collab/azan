name: Build APK

on:
  push:
    branches: [ main, master, Tg, Tg-backup, youtube-movies, youtube-movies-android5, movies-browser, movies-gecko ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      # توقيع ثابت: أضف السر DEBUG_KEYSTORE_BASE64 في إعدادات المستودع (اختياري)
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Show APK size, supported processors and permissions
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l $APK
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt
          $AAPT dump badging $APK | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|uses-permission|uses-feature)" 
      - uses: actions/upload-artifact@v4
        with:
          name: AzanHome-apk
          path: app/build/outputs/apk/debug/app-debug.apk
