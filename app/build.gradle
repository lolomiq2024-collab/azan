plugins {
    id 'com.android.application'
}

android {
    namespace 'com.loai.azanhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.loai.azanhome'
        minSdk 21
        targetSdk 34
        versionCode 15
        versionName '2.4'
    }

    // توقيع ثابت اختياري: إن حُدّد DEBUG_KEYSTORE_FILE يُوقَّع الـ APK به كي يُثبَّت التحديث فوق النسخة السابقة
    def keystore = System.getenv('DEBUG_KEYSTORE_FILE')
    if (keystore) {
        signingConfigs {
            debug {
                storeFile file(keystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    // قائمة القنوات الخاصة (channels/live.m3u) تُرفق داخل التطبيق كنسخة تعمل بدون إنترنت
    sourceSets {
        main {
            assets.srcDirs += ['../channels']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // لا تضغط ملفات الفيديو/الصوت داخل الـ APK كي تعمل من assets
    androidResources {
        noCompress 'mp4', 'mp3'
    }
}

dependencies {
    // مشغّل Media3 (ExoPlayer) لقنوات IPTV / HLS
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.3.1'
    implementation 'androidx.media3:media3-datasource:1.3.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.3.1'
}
