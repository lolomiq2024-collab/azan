pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // محرك Firefox (GeckoView)
        maven {
            url 'https://maven.mozilla.org/maven2/'
            content {
                includeGroupByRegex 'org\\.mozilla(\\..*)?'
            }
        }
    }
}
rootProject.name = "AzanHome"
include ':app'
